name: Verify Dunlin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.runner }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            node: '22'
            target: win32-x64-msvc
          - runner: ubuntu-24.04
            node: '22'
            target: linux-x64-gnu
          - runner: ubuntu-24.04
            node: '24'
            target: linux-x64-gnu
          - runner: macos-15
            node: '22'
            target: darwin-arm64
          - runner: macos-15-intel
            node: '22'
            target: darwin-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
      - name: Select Rust
        run: rustup override set 1.94.1
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/hannoy/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/hannoy/Cargo.toml --target-dir target/hannoy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm run build
      - run: npm test
      - run: npm --prefix tools/import ci
      - run: npm --prefix tools/rag ci
      - name: Verify the CLI and project workflows
        run: npm --prefix tools/rag test
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: dunlin-${{ matrix.target }}-node${{ matrix.node }}
          path: dist/packages/**/*.tgz
          if-no-files-found: error
