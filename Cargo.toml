[package]
name = "dunlin"
version = "0.5.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:memmap2", "dep:napi", "dep:napi-derive", "dep:rayon", "dep:rmcp", "dep:tokio"]

[dependencies]
blake3 = "1"
csv = "1.4"
dunce = "1"
# The HTTP server of serve (spec 28.10 step 3c).
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
memmap2 = { version = "0.9", optional = true }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
# Pinned: the version is part of the extraction cache key for PDFs.
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["legacy-crypto", "rendering"] }
# OCR on CPU. ONNX Runtime is loaded at run time from the files dunlin add oar-ocr prepares.
oar-ocr = { version = "=0.10.2", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
base64 = "0.23"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = { version = "1", optional = true }
# MCP servers (spec 28.10 step 3c): the official Rust SDK on a tokio runtime.
rmcp = { version = "3.10", optional = true, default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse numbers as JSON.parse does, so values from JavaScript and model APIs match.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
unicode-segmentation = "1.13"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "io-std", "macros", "net", "sync", "time"] }
url = "2"
# Embedding model calls from the transform stage. Mozilla roots, as Node.js fetch uses by default.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# The identifiers of answers in the Responses API object.
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
yaml-rust2 = { version = "0.13.0", default-features = false }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# The vector ranking that search uses, for tests without the node feature.
memmap2 = "0.9"
rayon = "1"
tempfile = "3"
