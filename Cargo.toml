[package]
name = "dunlin"
version = "0.5.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node = ["dep:memmap2", "dep:napi", "dep:napi-derive", "dep:rayon"]

[dependencies]
blake3 = "1"
csv = "1.4"
dunce = "1"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
memmap2 = { version = "0.9", optional = true }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = { version = "1", optional = true }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
unicode-segmentation = "1.13"
url = "2"
walkdir = "2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
