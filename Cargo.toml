[package]
name = "dunlin"
version = "0.5.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
blake3 = "1"
dunce = "1"
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
url = "2"
walkdir = "2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
