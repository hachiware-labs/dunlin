# The keyword-only baseline of benches/retrieval.mjs: the configuration of `nest init rag`, with
# the evaluation modules of docs/evaluation.md.
init:
  version: 1
  type: rag
source:
  modules:
    - use: source.filesystem
      with:
        path: ./docs
        exclude: []
    - use: loader.auto
      with:
        unsupported: error
        ocr: none
transform:
  modules:
    - use: text.normalize
      with:
        unicode: nfkc
    - use: chunk.length
      with:
        unit: characters
        size: 800
        overlap: 100
index:
  modules:
    - use: index.keyword
      with:
        tokenizer: lindera
        user_dictionary: null
search:
  modules:
    - use: query.normalize
      with:
        unicode: nfkc
    - use: retrieval.keyword
      with:
        top_k: 10
    - use: context.assemble
      with:
        budget_chars: 4000
        retrieval: fill_budget
        max_candidates: 100
        merge_overlaps: true
        truncate_last: true
        include_headings: true
ask:
  modules:
    - use: answer.generate
      with:
        model: answerer
        cite: true
        on_no_evidence: decline
models:
  answerer:
    provider: ollama
    kind: chat
    base_url: http://127.0.0.1:11434
    model: null
serve:
  transport: http
  host: 127.0.0.1
  port: 4318
  endpoints:
    - responses
    - search
    - mcp
  access:
    allowed_hosts:
      - localhost
      - 127.0.0.1
    allowed_origins: []
    auth:
      type: none
      token_env: null
  limits:
    max_request_bytes: 1048576
    request_timeout_seconds: 120
    max_concurrent: 8
eval:
  split: dev
  modules:
    - use: metric.evidence_recall
      with:
        at: [context, 1, 3, 10]
        short_evidence_chars: 40
        min_coverage: 0.8
        unresolved: count_as_missed
    - use: metric.latency
      with:
        percentiles: [50, 95, 99]
    - use: metric.evidence_rank
      with:
        at: [10]
    - use: metric.context_share
