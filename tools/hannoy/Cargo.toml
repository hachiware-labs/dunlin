[package]
name = "dunlin-hannoy"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
hannoy = "=0.2.0"
heed = { version = "=0.22.1", default-features = false }
rand = "0.10.2"
roaring = "0.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "symbols"
